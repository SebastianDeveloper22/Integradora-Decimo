<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLP Simulator — Plant Layout</title>
  <link rel="stylesheet" href="activity_slp.css">
  <style>
    /* ── Plant-layout-specific overrides ── */
    #plant-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }

    /* ── Tab navigation ── */
    .pl-tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      padding: 0 16px;
      background: var(--sb-bg);
    }
    .pl-tab-btn {
      padding: 9px 18px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-dim);
      cursor: pointer;
      font: 12px var(--font);
      letter-spacing: .02em;
      margin-bottom: -1px;
      transition: color .15s, border-color .15s;
    }
    .pl-tab-btn:hover { color: var(--text); }
    .pl-tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }

    /* ── Tab panels ── */
    .pl-tab-panel {
      display: none;
      flex: 1;
      overflow: auto;
      min-height: 0;
    }
    .pl-tab-panel.active { display: flex; }

    /* ── Floor plan panel ── */
    #tab-floor {
      align-items: flex-start;
      justify-content: center;
      padding: 24px;
    }
    .pl-svg-wrap {
      width: 100%;
      max-width: 860px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }
    #croquis { width: 100%; display: block; }
    .area-room { cursor: pointer; }
    .area-room rect { transition: filter 0.15s; }
    .area-room:hover rect { filter: brightness(1.3); }

    /* ── Tooltip ── */
    #tt-plant {
      position: fixed;
      background: #1c2840;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 11.5px;
      font-family: 'Inter', system-ui, sans-serif;
      color: #c8d8ea;
      pointer-events: none;
      opacity: 0;
      transition: opacity .1s;
      z-index: 999;
      white-space: nowrap;
      box-shadow: 0 6px 24px rgba(0,0,0,.55);
      line-height: 1.6;
    }
    #tt-plant strong { color: #fff; font-size: 12px; }
    #tt-plant .tt-zone { color: #6a82a0; font-size: 10px; margin-top: 1px; }

    /* Fix 3-col table alignment */
    #area-table thead th:nth-child(3) { text-align: left !important; }
    .td-zone {
      display: flex; align-items: center; gap: 5px;
      white-space: nowrap; color: var(--text-dim); font-size: 10.5px;
    }
    .td-zone-dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0; border: 1px solid rgba(255,255,255,.18);
    }

    /* ══════════════════════════════════
       MUTHER HALF-MATRIX DIAGRAM
       ══════════════════════════════════ */
    #tab-muther {
      flex-direction: column;
      padding: 0;
    }
    .muther-wrap {
      overflow: auto;
      padding: 20px 20px 28px;
      flex: 1;
    }
    .muther-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-head);
      margin: 0 0 14px;
      letter-spacing: .03em;
    }
    .muther-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .ml-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 10.5px; color: var(--text-dim);
    }
    .ml-swatch {
      width: 14px; height: 14px; border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700;
    }

    /* ── Table base ── */
    .muther-table {
      border-collapse: separate;
      border-spacing: 2px;
      font-family: var(--font);
    }

    /* Column headers — rotated */
    .muther-table th.col-hd {
      width: 30px;
      padding: 0 2px;
      vertical-align: bottom;
      text-align: center;
    }
    .col-hd-inner {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      display: block;
      font-size: 9px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 88px;
      padding: 2px 0;
    }
    .col-hd-inner strong {
      color: var(--text);
      font-size: 10px;
    }

    /* Row headers */
    .muther-table td.row-hd {
      text-align: right;
      padding: 2px 8px 2px 0;
      color: var(--text-dim);
      font-size: 10px;
      white-space: nowrap;
      min-width: 130px;
      vertical-align: middle;
    }
    .muther-table th.corner-hd {
      min-width: 130px;
      padding: 0;
    }

    /* All data cells */
    .muther-table td.m-cell {
      width: 30px;
      height: 30px;
      text-align: center;
      vertical-align: middle;
      font-size: 11px;
      font-weight: 700;
      border-radius: 3px;
      cursor: default;
    }

    /* Lower triangle — invisible spacer */
    td.m-lower { background: rgba(255,255,255,0.012); }

    /* Diagonal — zone colour */
    td.m-diag {
      font-size: 11px;
      font-weight: 800;
      border: 1px solid rgba(255,255,255,.12);
    }

    /* Relationship cell colours */
    td.m-A { background: #b91c1c; color: #ffffff; }
    td.m-E { background: #c2410c; color: #ffffff; }
    td.m-I { background: #15803d; color: #ffffff; }
    td.m-O { background: #1d4ed8; color: #ffffff; }
    td.m-X {
      background: #111827;
      color: #d1d5db;
      outline: 1px dashed #6b7280;
      outline-offset: -3px;
    }
    td.m-U { background: rgba(255,255,255,.06); color: #6b7280; font-size: 10px; }

    /* Hover highlight */
    .muther-table td.m-cell:not(.m-lower):not(.m-diag):hover {
      filter: brightness(1.35);
      cursor: pointer;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ══════════════ SIDEBAR ══════════════ -->
  <aside id="sidebar">

    <header id="sb-header">
      <div id="sb-logo">SLP</div>
      <div id="sb-titles">
        <p id="sb-title">Layout Simulator</p>
        <p id="sb-sub">Plant Layout</p>
      </div>
    </header>

    <!-- Zonas Funcionales -->
    <section class="sb-card">
      <h3 class="sc-label">Functional Zones</h3>
      <div id="zone-legend">
        <div class="zone-row"><div class="zone-dot" style="background:#1e4d8c"></div><span>Production (1,2,3,4,5,7,10)</span></div>
        <div class="zone-row"><div class="zone-dot" style="background:#7a3f00"></div><span>Logistics (6,17)</span></div>
        <div class="zone-row"><div class="zone-dot" style="background:#0e4a22"></div><span>Administrative (9,11,12,14,15)</span></div>
        <div class="zone-row"><div class="zone-dot" style="background:#5a1280"></div><span>Services (16)</span></div>
        <div class="zone-row"><div class="zone-dot" style="background:#3a3a18"></div><span>Sec./Free (8,13)</span></div>
      </div>
    </section>

    <!-- Tabla de Áreas -->
    <section class="sb-card sb-grow">
      <h3 class="sc-label">Areas</h3>
      <div id="tbl-scroll">
        <table id="area-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Area</th>
              <th>Zone</th>
            </tr>
          </thead>
          <tbody id="area-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Rutas y Flujos de Movimiento -->
    <section class="sb-card">
      <h3 class="sc-label">Visualize Routes</h3>
      <div class="route-filters">
        <button class="route-toggle rt-mat"   id="btn-route-mat"   onclick="toggleRoute('mat')">
          <span class="route-dot" style="background:#C97C2A"></span>
          <span class="route-btn-body">
            <span class="route-btn-title">Material Flow</span>
            <span class="route-btn-seq">17→6→7→3→4→5→6</span>
          </span>
        </button>
        <button class="route-toggle rt-maint" id="btn-route-maint" onclick="toggleRoute('maint')">
          <span class="route-dot" style="background:#5294C8"></span>
          <span class="route-btn-body">
            <span class="route-btn-title">Maintenance</span>
            <span class="route-btn-seq">1→10→{2, 3, 4}</span>
          </span>
        </button>
        <button class="route-toggle rt-admin" id="btn-route-admin" onclick="toggleRoute('admin')">
          <span class="route-dot" style="background:#4A9860"></span>
          <span class="route-btn-body">
            <span class="route-btn-title">Administrative / Visits</span>
            <span class="route-btn-seq">14→{9, 11, 12}→16</span>
          </span>
        </button>
        <button class="route-toggle rt-evac"  id="btn-route-evac"  onclick="toggleRoute('evac')">
          <span class="route-dot" style="background:#C84848"></span>
          <span class="route-btn-body">
            <span class="route-btn-title">Evacuation</span>
            <span class="route-btn-seq">Prod.→⚠8 | Admin→⚠13</span>
          </span>
        </button>
      </div>
    </section>

    <footer id="sb-footer">
      <span>↔ Hover over an area for more info</span>
    </footer>

  </aside>
  <!-- ══════════════ FIN SIDEBAR ══════════════ -->

  <!-- ══════════════ PLANTA ══════════════ -->
  <main id="plant-area">

    <!-- Tab navigation -->
    <div class="pl-tabs" role="tablist" aria-label="Vistas del simulador">
      <button class="pl-tab-btn active" role="tab" tabindex="0" aria-selected="true" aria-controls="tab-floor" id="btn-tab-floor" data-tab="floor">Floor Plan</button>
      <button class="pl-tab-btn" role="tab" tabindex="-1" aria-selected="false" aria-controls="tab-muther" id="btn-tab-muther" data-tab="muther">Muther Chart</button>
    </div>

    <!-- Tab: Floor Plan -->
    <div id="tab-floor" class="pl-tab-panel active" role="tabpanel" aria-labelledby="btn-tab-floor">
    <div class="pl-svg-wrap">
      <!-- viewBox 720×510 preserves exact original layout -->
      <svg id="croquis" viewBox="0 0 720 510" role="img" xmlns="http://www.w3.org/2000/svg">
        <title>SLP Layout — Industrial Plant (17 areas)</title>
        <desc>Proposed distribution of 17 areas according to the SLP analysis.</desc>

        <!-- ══ OUTER WALL ══ -->
        <rect x="14" y="14" width="692" height="468" rx="5"
              fill="none" stroke="#3a4a5a" stroke-width="2"/>

        <!-- ══ ZONE BACKGROUND OVERLAYS ══ -->
        <!-- Logistics -->
        <rect x="15" y="15" width="499" height="90" rx="3"
              fill="rgba(122,63,0,0.06)" stroke="rgba(184,96,16,0.22)"
              stroke-width="1" stroke-dasharray="5 4"/>
        <text x="20" y="27" font-size="8" fill="rgba(184,96,16,0.55)"
              font-family="'Inter',system-ui,sans-serif" font-weight="700"
              letter-spacing="0.09em">LOGISTICS</text>

        <!-- Production -->
        <rect x="15" y="107" width="499" height="288" rx="3"
              fill="rgba(30,77,140,0.06)" stroke="rgba(45,106,184,0.20)"
              stroke-width="1" stroke-dasharray="6 5"/>
        <text x="20" y="120" font-size="8" fill="rgba(45,106,184,0.60)"
              font-family="'Inter',system-ui,sans-serif" font-weight="700"
              letter-spacing="0.09em">PRODUCTION</text>

        <!-- Admin -->
        <rect x="516" y="73" width="188" height="330" rx="3"
              fill="rgba(14,74,34,0.06)" stroke="rgba(26,120,56,0.22)"
              stroke-width="1" stroke-dasharray="6 5"/>
        <text x="520" y="86" font-size="8" fill="rgba(26,120,56,0.60)"

              letter-spacing="0.09em">ADMINISTRATION</text>

        <!-- ══ ROW 1 — LOGISTICS ══ -->

        <!-- 17: Carga y Descarga -->

                text-anchor="middle" font-family="'Inter',system-ui,sans-serif" x="81" y="53">17. Loading &</text>

        <!-- 6: Almacén -->

          <text font-size="10.5" font-weight="600" fill="#d4d470"

        <!-- 4: Ensamble -->

          <text font-size="11" font-weight="600" fill="#9dccf0"
                text-anchor="middle" dominant-baseline="central"
                font-family="'Inter',system-ui,sans-serif" x="374" y="146">4. Assembly</text>

          <text font-size="10" font-weight="600" fill="#9dccf0"
                text-anchor="middle" dominant-baseline="central"

          <text font-size="10" font-weight="600" fill="#7ae8a0"

                font-family="'Inter',system-ui,sans-serif" x="561" y="107">14. Reception</text>
        </g>

        <!-- 12: Sala de Juntas -->

          <text font-size="10" font-weight="600" fill="#7ae8a0"

              stroke-width="1" stroke-dasharray="6 5"/>
        <text font-size="9" fill="rgba(130,150,170,0.5)"
              text-anchor="middle" dominant-baseline="central"
              font-family="'Inter',system-ui,sans-serif" x="264" y="439">— Corridor / Main Hall —</text>


        <!-- ══ ROUTE OVERLAYS ══ -->
        <defs>
          <marker id="ar-mat"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#C97C2A"/>
          </marker>
          <marker id="ar-maint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#5294C8"/>
          </marker>
          <marker id="ar-admin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#4A9860"/>
          </marker>
          <marker id="ar-evac"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 9 5 L 0 9 z" fill="#C84848"/>
          </marker>
          <filter id="route-glow" x="0" y="0" width="720" height="510" filterUnits="userSpaceOnUse">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- ── Route 1 · Flujo de Materiales (orange) ─────────────────────
             Secuencia: 17 → 6 → 7 → 3 → 4 → 5 → 6

        <g id="route-mat" style="display:none">

<script src="slp_data.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════
   DATA
   ═══════════════════════════════════ */
const SLP_DATA = window.SLP_DATA || {};
const AREAS = SLP_DATA.AREAS || [];
const ZONES = SLP_DATA.ZONES || {};

/* ═══════════════════════════════════
   BUILD SIDEBAR TABLE
   ═══════════════════════════════════ */
(function buildTable() {
  const tbody = document.getElementById('area-tbody');
  AREAS.forEach((area, i) => {
    const zone = ZONES[area.zone];
    const tr = document.createElement('tr');
    tr.id = `row-${i}`;
    tr.innerHTML =
      `<td class="td-id">${area.id}</td>` +
      `<td class="td-name">${area.name}</td>` +
      `<td><div class="td-zone">` +
        `<span class="td-zone-dot" style="background:${zone.fill}"></span>` +
        `<span>${zone.label}</span>` +
      `</div></td>`;
    tbody.appendChild(tr);
  });
})();

/* ═══════════════════════════════════
   TOOLTIP + HOVER INTERACTIONS
   ═══════════════════════════════════ */
const tt    = document.getElementById('tt-plant');
const rooms = document.querySelectorAll('.area-room');

/* Build a quick lookup: data-id → AREAS entry index */
const areaById = {};
AREAS.forEach((a, i) => { areaById[a.id] = i; });

let lastHighlightedRow = null;

function clearRowHighlight() {
  if (lastHighlightedRow) {
    lastHighlightedRow.classList.remove('row-drag');
    lastHighlightedRow = null;
  }
}

function highlightRow(idx) {
  clearRowHighlight();
  const row = document.getElementById(`row-${idx}`);
  if (row) {
    row.classList.add('row-drag');
    lastHighlightedRow = row;
  }
}

/* Single mousemove listener on the SVG wrapper for performance */
document.getElementById('croquis').addEventListener('mousemove', function(e) {
  /* Walk up from the target to find an .area-room group */
  let el = e.target;
  while (el && el !== this) {
    if (el.classList && el.classList.contains('area-room')) break;
    el = el.parentElement;
  }

  if (!el || el === this) {
    tt.style.opacity = '0';
    clearRowHighlight();
    return;
  }

  const id   = parseInt(el.getAttribute('data-id'), 10);
  const idx  = areaById[id];
  if (idx === undefined) return;

  const area = AREAS[idx];
  const zone = ZONES[area.zone];

  /* Tooltip content */
  tt.innerHTML =
    `<strong>${area.id}. ${area.name}</strong>` +
    `<div class="tt-zone">${zone.label}</div>` +
    `<div style="margin-top:4px;font-size:10.5px;color:#6a82a0">` +
      `SLP: <span style="color:#c8d8ea;font-weight:600">${area.slp} pts</span>` +
    `</div>`;

  /* Position tooltip near cursor, keep on screen */
  const vw = window.innerWidth, vh = window.innerHeight;
  let tx = e.clientX + 14, ty = e.clientY - 8;
  tt.style.opacity = '0.01'; /* momentarily visible to measure */
  const tw = tt.offsetWidth  || 160;
  const th = tt.offsetHeight || 70;
  if (tx + tw + 6 > vw) tx = e.clientX - tw - 14;
  if (ty + th + 6 > vh) ty = e.clientY - th - 8;
  tt.style.left    = tx + 'px';
  tt.style.top     = ty + 'px';
  tt.style.opacity = '1';

  /* Highlight sidebar row */
  highlightRow(idx);
});

document.getElementById('croquis').addEventListener('mouseleave', function() {
  tt.style.opacity = '0';
  clearRowHighlight();
});

/* ═══════════════════════════════════════════════════════════════
   MUTHER HALF-MATRIX  — relationship data (upper triangle)
   Same rules as activity_slp.js:
   · U→X : Admin(9,11,12,14,15) vs noise/traffic(2,17)
   · U→O : Restroom(16) and Meeting Point(13) vs any previous U
   ═══════════════════════════════════════════════════════════════ */
const TRIANGLE = SLP_DATA.TRIANGLE || [];

function getRelation(i, j) {
  if (i === j) return '-';
  if (i > j) { const t = i; i = j; j = t; }
  return TRIANGLE[i * 17 - (i * (i + 1) >> 1) + j - i - 1];
}

/* ═══════════════════════════════════════════════════════════════
   BUILD MUTHER DIAGRAM
   ═══════════════════════════════════════════════════════════════ */
(function buildMuther() {
  /* Legend */
  const LEGEND = [
    { code:'A', bg:'#b91c1c', text:'#ffffff', label:'A — Absolutely necessary'  },
    { code:'E', bg:'#c2410c', text:'#ffffff', label:'E — Especially important'  },
    { code:'I', bg:'#15803d', text:'#ffffff', label:'I — Important'              },
    { code:'O', bg:'#1d4ed8', text:'#ffffff', label:'O — Ordinary closeness'     },
    { code:'X', bg:'#111827', text:'#d1d5db', label:'X — Not desirable'          },
    { code:'U', bg:'rgba(255,255,255,.06)', text:'#6b7280', label:'U — Unimportant' },
  ];
  const lgWrap = document.getElementById('muther-legend');
  LEGEND.forEach(l => {
    const div = document.createElement('div');
    div.className = 'ml-item';
    div.innerHTML =
      `<span class="ml-swatch" style="background:${l.bg};color:${l.text}">${l.code}</span>` +
      `<span>${l.label}</span>`;
    lgWrap.appendChild(div);
  });

  const container = document.getElementById('muther-container');
  const table = document.createElement('table');
  table.className = 'muther-table';

  /* ── Column header row ── */
  const thead = document.createElement('thead');
  const hrow  = document.createElement('tr');

  /* Corner placeholder */
  const corner = document.createElement('th');
  corner.className = 'corner-hd';
  hrow.appendChild(corner);

  /* One header per area */
  for (let j = 0; j < 17; j++) {
    const th = document.createElement('th');
    th.className = 'col-hd';
    const inner = document.createElement('span');
    inner.className = 'col-hd-inner';
    inner.innerHTML = `<strong>${AREAS[j].id}</strong><br>${AREAS[j].name}`;
    th.appendChild(inner);
    hrow.appendChild(th);
  }
  thead.appendChild(hrow);
  table.appendChild(thead);

  /* ── Body rows ── */
  const tbody = document.createElement('tbody');
  for (let i = 0; i < 17; i++) {
    const tr = document.createElement('tr');

    /* Row header: area name */
    const rh = document.createElement('td');
    rh.className = 'row-hd';
    rh.textContent = `${AREAS[i].id}. ${AREAS[i].name}`;
    tr.appendChild(rh);

    for (let j = 0; j < 17; j++) {
      const td = document.createElement('td');
      td.className = 'm-cell';

      if (j < i) {
        /* Lower triangle — blank */
        td.classList.add('m-lower');
      } else if (j === i) {
        /* Diagonal — zone colour */
        td.classList.add('m-diag');
        const zone = ZONES[AREAS[i].zone];
        td.style.background = zone.fill;
        td.style.color       = zone.text;
        td.textContent       = AREAS[i].id;
        td.title             = `${AREAS[i].id}. ${AREAS[i].name} (${zone.label})`;
      } else {
        /* Upper triangle — relationship */
        const code = getRelation(i, j);
        td.classList.add(`m-${code}`);
        td.textContent = code;
        td.title = `${AREAS[i].name} ↔ ${AREAS[j].name}: ${code}`;
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  container.appendChild(table);
})();

/* ═══════════════════════════════════════════════════════════════
   TAB SWITCHING
   ═══════════════════════════════════════════════════════════════ */
const tabButtons = Array.from(document.querySelectorAll('.pl-tab-btn'));
function activateTab(btn) {
  const target = btn.dataset.tab;
  tabButtons.forEach((b, idx) => {
    const selected = b === btn;
    b.classList.toggle('active', selected);
    b.setAttribute('aria-selected', selected ? 'true' : 'false');
    b.setAttribute('tabindex', selected ? '0' : '-1');
    if (selected) b.dataset.tabIndex = String(idx);
  });
  document.querySelectorAll('.pl-tab-panel').forEach(p =>
    p.classList.toggle('active', p.id === 'tab-' + target)
  );
}
tabButtons.forEach((btn, index) => {
  btn.addEventListener('click', () => activateTab(btn));
  btn.addEventListener('keydown', (e) => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
    e.preventDefault();
    let next = index;
    if (e.key === 'ArrowRight') next = (index + 1) % tabButtons.length;
    if (e.key === 'ArrowLeft') next = (index - 1 + tabButtons.length) % tabButtons.length;
    if (e.key === 'Home') next = 0;
    if (e.key === 'End') next = tabButtons.length - 1;
    tabButtons[next].focus();
    activateTab(tabButtons[next]);
  });
});

/* ═══════════════════════════════════════════════════════════════
   ROUTE TOGGLES
   ═══════════════════════════════════════════════════════════════ */
function toggleRoute(type) {
  const btn  = document.getElementById('btn-route-' + type);
  const grp  = document.getElementById('route-' + type);
  const on   = btn.classList.toggle('active');
  grp.style.display = on ? '' : 'none';
}
</script>
